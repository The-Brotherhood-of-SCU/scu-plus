name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（如 v2.3.0）'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      # workflow_dispatch 时必须检出 inputs.tag 指定的提交，而不是触发分支的 HEAD
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate release notes
        id: generate_notes
        run: python .github/generate_release_notes.py

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.18.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build chrome plugin
        run: pnpm build --zip

      - name: Build firefox plugin
        run: pnpm build --zip --target=firefox-mv3

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ env.title }}
          body: ${{ env.release_notes }}
          # chrome 与 firefox 的 zip 始终构建并上传
          files: |
            ./build/chrome-mv3-prod.zip
            ./build/firefox-mv3-prod.zip
          draft: false
          prerelease: false
